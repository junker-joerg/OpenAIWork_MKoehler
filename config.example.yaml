attachments_dir: attachments
resources_dir_name: _resources
prefer_wikilink_embeds: true
keep_meta_section: false
inline_tags: false
folder_map:
  People: People
  Research: Research
  Project: Projects
  Task: Tasks
  Literature: Literature
  Story: Story
  Inbox: Inbox
  Other: Other
classification_weights:
  person_marker: 0.7
  research_marker: 0.7
  task_checkbox: 0.6
  project_title: 0.6
  literature_source: 0.65
  story_keywords: 0.6
  fallback_inbox: 0.45
stopwords:
  - and
  - the
  - und
  - oder
  - der
  - die
  - das
whitelist_titles:
  - AI
  - ML
  - UX
tag_rules:
  regex_mappings:
    - pattern: "\\bpython\\b"
      tag: python
    - pattern: "\\bobsidian\\b"
      tag: obsidian
